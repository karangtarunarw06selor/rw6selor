<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111111" />

  <title>Game Bilyard</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      padding: 8px 12px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,.12);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .title {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .title p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: .7;
    }

    .fullscreen-btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: #f5c542;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .back-link:active,
    .fullscreen-btn:active {
      transform: scale(.97);
    }

    .game-area {
      width: 100%;
      height: calc(100vh - 58px);
      background: #000;
      position: relative;
      overflow: hidden;
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      touch-action: none;
    }

    .mobile-note {
      display: none;
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 5;
      padding: 8px 10px;
      background: rgba(0,0,0,.62);
      color: #f5d76e;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .topbar {
        height: 54px;
        padding: 7px 8px;
      }

      .title h1 {
        font-size: 15px;
      }

      .title p {
        display: none;
      }

      .back-link,
      .fullscreen-btn {
        font-size: 12px;
        padding: 8px 9px;
      }

      .game-area {
        height: calc(100vh - 54px);
      }

      .mobile-note {
        display: block;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .topbar {
        display: none;
      }

      .game-area {
        height: 100vh;
      }

      .mobile-note {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="back-link" href="index.html">← Kembali</a>

    <div class="title">
      <h1>Game Bilyard</h1>
      <p>Mainkan langsung dari browser</p>
    </div>

    <button class="fullscreen-btn" type="button" onclick="openFullscreen()">
      Fullscreen
    </button>
  </header>

  <main class="game-area" id="gameArea">
    <iframe
      id="gameFrame"
      src="bilyard/"
      title="Game Bilyard"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
      scrolling="no">
    </iframe>

    <div class="mobile-note">
      Jika kontrol sulit di HP, putar layar ke landscape atau tekan Fullscreen.
    </div>
  </main>

  <script>
    function openFullscreen() {
      const gameArea = document.getElementById("gameArea");

      if (gameArea.requestFullscreen) {
        gameArea.requestFullscreen();
      } else if (gameArea.webkitRequestFullscreen) {
        gameArea.webkitRequestFullscreen();
      } else if (gameArea.msRequestFullscreen) {
        gameArea.msRequestFullscreen();
      }
    }

    document.addEventListener("touchmove", function(event) {
      const gameArea = document.getElementById("gameArea");

      if (gameArea && gameArea.contains(event.target)) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
