<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Billiard MMS.05</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255,214,80,.18), transparent 28%),
        radial-gradient(circle at bottom, rgba(22,160,110,.18), transparent 36%),
        linear-gradient(180deg, #07120f, #050807);
      color: white;
    }

    .startScreen {
      width: 100vw;
      height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .startCard {
      width: min(430px, 92vw);
      padding: 34px 24px 30px;
      border-radius: 28px;
      background: rgba(5, 8, 15, .82);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow:
        0 24px 70px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(255,255,255,.04);
      backdrop-filter: blur(10px);
    }

    .logoWrap {
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      overflow: hidden;
    }

    .logoWrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .gameTitle {
      margin: 0;
      color: #ffd650;
      font-size: clamp(38px, 8vw, 58px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: .5px;
      text-shadow: 0 5px 18px rgba(0,0,0,.45);
    }

    .gameSubTitle {
      margin: 12px 0 28px;
      color: rgba(255,255,255,.72);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .pressStartBtn {
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffe16a, #ffad32);
      color: #111;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255,173,50,.22);
      animation: pulseStart 1.3s ease-in-out infinite;
    }

    .footerText {
      margin-top: 18px;
      color: rgba(255,255,255,.42);
      font-size: 12px;
    }

    @keyframes pulseStart {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.035);
        filter: brightness(1.08);
      }
    }

    @media (orientation: portrait) {
      .startCard {
        padding: 30px 20px 26px;
      }

      .logoWrap {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }

      .pressStartBtn {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="startScreen">
    <div class="startCard">
      <div class="logoWrap">
        <img src="assets/mudamudi-logo.png" alt="Muda Mudi Logo">
      </div>

      <h1 class="gameTitle">Muda-Mudi Selor</h1>
      <div class="gameSubTitle">Billiard</div>

      <button class="pressStartBtn" onclick="startGame()">
        Press Start
      </button>

      <div class="footerText">
        Muda Mudi Selor Game Project
      </div>
    </div>
  </div>

  <script>
    function startGame() {
      window.location.href = "lobby.html?v=1.1" + Date.now();
    }
  </script>
</body>
</html>
