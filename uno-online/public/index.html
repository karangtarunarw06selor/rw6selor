<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNO Online</title><link rel="stylesheet" href="game.css"></head><body><main><header><a id="back" href="/">‹ Portal</a><div><h1>UNO ONLINE</h1><small id="brand">MUDA MUDI SELOR</small></div><b id="online" aria-label="Server online">● ONLINE</b></header><section id="lobby" class="panel"><h2>Main bareng, tanpa curang</h2><p>Kartu dan giliran diatur server. Buat ruang atau masuk dengan kode teman.</p><label>Nama<input id="name" maxlength="20" autocomplete="nickname"></label><div class="actions"><button id="create">Buat Ruang</button><button id="openJoin" class="secondary">Gabung</button></div><div id="joinbox" hidden><label>Kode ruang<input id="code" maxlength="6" autocapitalize="characters"></label><button id="join">Masuk Ruang</button></div></section><section id="room" hidden><div class="roombar"><b>Ruang <span id="roomcode"></span></b><button id="leave" class="danger">Keluar</button></div><div id="notice"></div><div id="players" class="players"></div><div id="table" class="table" hidden><div class="pile"><button id="draw" class="deck">UNO<br><small>AMBIL</small></button><div id="discard" class="card"></div></div><div id="turn"></div><ol id="standings" class="standings" hidden></ol><div id="colors" hidden><b>Pilih warna</b><button data-color="red"></button><button data-color="yellow"></button><button data-color="green"></button><button data-color="blue"></button></div><label class="uno"><input id="uno" type="checkbox"> Teriak UNO!</label><small id="handhint">Geser untuk melihat semua kartu</small><div id="hand" class="hand"></div><button id="pass" hidden>Lewati giliran</button></div><button id="start" hidden>Mulai Permainan</button><button id="rematch" hidden>Main Lagi</button></section><div id="toast" role="alert"></div></main><script src="/uno/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
