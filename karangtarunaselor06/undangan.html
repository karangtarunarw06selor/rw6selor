<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Undangan Rapat RW06 Selor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(180deg,#f7fbff,#eaf5ff); color: #0f172a; padding: 40px 15px; }
    .container { max-width: 760px; margin: 0 auto; background: #ffffff; padding: 35px; border-radius: 22px; box-shadow: 0 24px 70px rgba(15,94,168,.14); border-top: 7px solid #0f5ea8; }
    .header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #dbeafe; }
    .header h1 { color: #0b2c55; font-size: 1.8rem; margin-bottom: 6px; font-weight: 900; }
    .header p { color: #64748b; font-size: 0.95rem; }
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; font-weight: 800; margin-bottom: 8px; color: #0b2c55; font-size: 0.95rem; }
    .form-group label i { margin-right: 6px; color: #0f5ea8; }
    input[type="text"], textarea { width: 100%; padding: 14px; border: 1px solid #bfdbfe; border-radius: 14px; font-size: 1rem; transition: all 0.2s ease; background-color: #fff; }
    input[type="text"]:focus, textarea:focus { border-color: #0f5ea8; box-shadow: 0 0 0 4px rgba(15,94,168,.12); outline: none; }
    textarea { resize: vertical; min-height: 180px; font-family: inherit; line-height: 1.5; }
    .btn-kirim { display: inline-flex; align-items:center; justify-content:center; gap:10px; width: 100%; background: linear-gradient(135deg,#0b2c55,#0f5ea8); color: white; border: none; padding: 15px; font-size: 1.05rem; font-weight: 900; border-radius: 14px; cursor: pointer; text-align: center; }
    .btn-kirim:disabled { opacity:.65; cursor: wait; }
    #status-notif { margin-top: 22px; padding: 14px; border-radius: 14px; font-weight: 800; text-align: center; display: none; font-size: 0.95rem; }
    .sukses { background-color: #ecfdf5; color: #047857; border: 1px solid #bbf7d0; }
    .gagal { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .loading { background-color: #eff6ff; color: #0f5ea8; border: 1px solid #bfdbfe; }
    .tips { background: #eff6ff; border-left: 4px solid #0f5ea8; padding: 12px; margin-bottom: 24px; border-radius: 0 12px 12px 0; font-size: 0.9rem; color: #0b2c55; line-height:1.55; }
  </style>
  <link rel="stylesheet" href="mobile-global-overrides.css?v=7">
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fa-solid fa-paper-plane"></i> Draft Undangan Rapat</h1>
    <p>Data email anggota diambil dari database VPS RW06 Selor.</p>
  </div>

  <div class="tips">
    <strong><i class="fa-solid fa-circle-info"></i> Catatan:</strong> Halaman ini tidak memakai Google Script. Sistem membuat draft email dari data anggota aktif di database VPS, lalu dibuka di aplikasi email perangkat.
  </div>

  <div class="form-group">
    <label for="subjek"><i class="fa-solid fa-envelope-open-text"></i> Subjek / Perihal Email</label>
    <input type="text" id="subjek" placeholder="Contoh: Undangan Rapat Koordinasi Panitia Agustus-an">
  </div>

  <div class="form-group">
    <label for="pesan"><i class="fa-solid fa-file-lines"></i> Agenda / Inti Isi Surat</label>
    <textarea id="pesan" placeholder="Tulis info rapat di sini...&#10;Hari: ...&#10;Jam: ...&#10;Tempat: ..."></textarea>
  </div>

  <button class="btn-kirim" id="btnSend" onclick="buatDraftEmail()"><i class="fa-solid fa-envelope"></i> Buat Draft Email dari Database VPS</button>
  <div id="status-notif"></div>
</div>

<script>
async function buatDraftEmail() {
  const subjek = document.getElementById('subjek').value.trim();
  const pesan = document.getElementById('pesan').value.trim();
  const btn = document.getElementById('btnSend');
  const notif = document.getElementById('status-notif');
  if (!subjek || !pesan) { alert('Harap isi perihal dan isi pesan undangan dulu.'); return; }
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil email anggota...';
  notif.className = 'loading';
  notif.textContent = 'Mengambil daftar email anggota aktif dari database VPS...';
  notif.style.display = 'block';
  try {
    const response = await fetch('/common/api/members_list.php?is_active=1&cache=' + Date.now());
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.message || 'Gagal mengambil data anggota.');
    const emails = [...new Set((result.data || []).map((row) => String(row.email || '').trim()).filter((email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)))];
    if (!emails.length) throw new Error('Belum ada email anggota aktif di database VPS.');
    const body = pesan + '\n\n--\nKarangtaruna RW06 Selor';
    const mailto = 'mailto:?bcc=' + encodeURIComponent(emails.join(',')) + '&subject=' + encodeURIComponent(subjek) + '&body=' + encodeURIComponent(body);
    location.href = mailto;
    notif.className = 'sukses';
    notif.textContent = 'Draft email dibuat untuk ' + emails.length + ' anggota aktif. Jika aplikasi email tidak terbuka, cek konfigurasi email/browser.';
  } catch (error) {
    notif.className = 'gagal';
    notif.textContent = error.message || 'Gagal membuat draft email.';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-envelope"></i> Buat Draft Email dari Database VPS';
  }
}
</script>
<script src="member-auth.js?v=email-only-1"></script>
</body>
</html>
