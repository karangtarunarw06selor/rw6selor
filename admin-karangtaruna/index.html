<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Portal Admin - RW06 Selor</title>
    
    
    <link rel="apple-touch-icon" href="images/karangtaruna.avif">
    <link rel="icon" href="images/karangtaruna.avif" type="image/avif">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css?=v2"> 
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="mobile-global-overrides.css?v=7">
</head>
<body class="login-page-body"> <header class="site-header">
        <div class="header-logo-area">
            <div class="logo-wrapper">
                <img src="images/karangtaruna.avif" alt="Logo RW06 Selor" class="mini-logo">
                <div class="header-text">
                    <span class="brand-title">KARANGTARUNA</span>
                    <span class="brand-subtitle">RW06 SEDAHROMOLOR<br></span>
                </div>
            </div>
        </div>
        <div class="header-secure-badge">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
    </header>

    <div class="login-page-wrapper">
        <div class="login-content-box">
            <h3 class="box-title">PORTAL ADMIN <br>KARANGTARUNA RW6</h3>
            <hr class="box-divider">
            <p class="box-subtitle">Silakan masukkan kode akses khusus pengurus untuk masuk ke sistem administrasi data.</p><br>
            
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="access-code" class="login-input" placeholder="Masukkan Password...">
            </div>
            
            <div id="error-message" class="error-text"></div>

            <button onclick="validasiLogin()" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
            </button>
        </div>
    </div>

    <footer class="portal-footer">
        <p>&copy; 2026 Portal RW06 Selor.</p>
    </footer>


    
    <script src="script.js?v=100"></script> 
</body>
</html>
